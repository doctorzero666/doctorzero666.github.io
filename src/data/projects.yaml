- slug: wit-or-die
  name: "Wit or Die"
  featured: true
  order: 6
  years: "2026"
  category: {zh: "实时对战、LLM 出题、链上奖池", en: "Real-time multiplayer, LLM questions, on-chain pool"}
  summary:
    zh: "多人实时英语拼写对战：AI 出题，答错触发概率淘汰，赢家获得奖池。"
    en: "A real-time multiplayer spelling battle: AI sets the questions, wrong answers risk elimination, the winner takes the pool."
  why:
    zh: "我想把背单词变成一场真正有压力、有反馈，而且有点荒诞的对战游戏。"
    en: "I wanted to turn vocabulary drills into a real battle game: one with pressure, feedback, and a touch of the absurd."
  system:
    zh:
      - "服务端权威：判题、计分、难度与淘汰全部由 FastAPI + WebSocket 服务端裁定，客户端只提交答案。"
      - "每位玩家预取 3 道题，把秒级的 LLM 出题移出对局关键路径；难度在 1 到 5 级间随连对上调。"
      - "LLM 不可用时逐级降级到静态题库与字符串比对，没有 API key 也能完整对局。"
      - "合约只有 deposit、payout、totalPot，没有测试；VRF、NFT、USDT 入场只停留在设计阶段。"
    en:
      - "Server-authoritative: grading, scoring, difficulty and elimination are all decided by the FastAPI + WebSocket server; clients only submit answers."
      - "A 3-question prefetch queue per player keeps seconds-long LLM generation off the critical path; difficulty rises from 1 to 5 on streaks."
      - "When the LLM is unavailable it degrades step by step to a static question bank and string matching, so a full round works without an API key."
      - "The contract has only deposit, payout and totalPot and no tests; VRF, NFT rewards and USDT entry exist only as design."
  evidence:
    zh:
      - "SPARK AI Hackathon SpoonOS LLM 应用赛道第一名，该届共 52 个提交项目。"
    en:
      - "1st place, SpoonOS LLM Application Track, SPARK AI Hackathon (52 projects submitted)."
  stack: ["Next.js 14", "TypeScript", "FastAPI", "WebSocket", "SpoonOS", "Solidity", "Hardhat", "viem"]
  links:
    - {label: {zh: "仓库", en: "Repo"}, url: "https://github.com/doctorzero666/Wit-or-die"}
    - {label: {zh: "参赛提交", en: "Submission"}, url: "https://github.com/CasualHackathon/SPARK-AI-Hackathon/tree/main/submissions/JadeTwinkle"}
    - {label: {zh: "获奖公示", en: "Award announcement"}, url: "https://x.com/LXDAO_Official/status/2019009266594861098"}
  status:
    zh: "黑客松作品，完整对局只在本地联通；线上版本未接合约。"
    en: "Hackathon build; the full loop runs locally only, and the hosted build is not wired to the contract."
  disclosure:
    zh: "4 人黑客松团队中唯一的开发者，前端、后端、LLM 适配层与合约代码均由本人编写。"
    en: "The only developer in a four-person hackathon team; I wrote the frontend, backend, LLM adapter layer and contract code."
